<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<body>
    <!-- Absolute Url -->
    <a href="https://www.google.com/">Google</a>

    <!-- Relative Url -->
    <a href="html.png">HTML</a>

    <!-- HyperLink -->
    <a href="https://chatgpt.com/gpts" target="_blank">CHAT GPTS</a>

    <!-- Button Link -->
    <a href="https://www.tutorialspoint.com"><button>HTML Tutorial</button></a>

    <!-- Email Link -->
    <a href="mailto:someone@example.com">SEND EMAIl</a>

    <!-- Image Link -->
    <a href="https://www.tutorialspoint.com"><img src="html.png"></a>
</body>
</html>
